version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: trivexa_postgres
    restart: always
    ports:
      - "2678:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-trivexa_db}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - trivexa_network

  redis:
    image: redis:8-alpine
    container_name: trivexa_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - trivexa_network

  app:
    build: .
    container_name: trivexa_backend
    restart: always
    ports:
      - "${APP_PORT:-3500}:${APP_PORT:-3500}"
    environment:
      NODE_ENV: production
      APP_PORT: ${APP_PORT:-3500}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-trivexa_db}
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    depends_on:
      - postgres
      - redis
    networks:
      - trivexa_network

networks:
  trivexa_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
