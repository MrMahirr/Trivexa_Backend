version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: trivexa_postgres
    restart: always
    ports:
      - "2678:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-trivexa_db}
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
