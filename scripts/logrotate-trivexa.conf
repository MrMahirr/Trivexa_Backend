# Logrotate configuration for Trivexa
# Install: sudo cp logrotate-trivexa.conf /etc/logrotate.d/trivexa

# Backend Application Logs
/opt/trivexa/trivexa_backend/logs/*.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 0640 node node
    sharedscripts
    postrotate
        # Reload PM2 to reopen log files
        /usr/bin/pm2 reloadLogs > /dev/null 2>&1 || true
    endscript
}

# Nginx Access Logs
/var/log/nginx/trivexa_access.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 www-data adm
    sharedscripts
    prerotate
        if [ -d /etc/logrotate.d/httpd-prerotate ]; then \
            run-parts /etc/logrotate.d/httpd-prerotate; \
        fi
    endscript
    postrotate
        # Reload Nginx to reopen log files
        [ -s /run/nginx.pid ] && kill -USR1 `cat /run/nginx.pid` > /dev/null 2>&1 || true
    endscript
}

# Nginx Error Logs
/var/log/nginx/trivexa_error.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 0640 www-data adm
    sharedscripts
    postrotate
        [ -s /run/nginx.pid ] && kill -USR1 `cat /run/nginx.pid` > /dev/null 2>&1 || true
    endscript
}

# PM2 Logs
/home/node/.pm2/logs/*.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    create 0640 node node
    sharedscripts
    postrotate
        /usr/bin/pm2 reloadLogs > /dev/null 2>&1 || true
    endscript
}

# Backup Logs
/opt/trivexa/backups/*.log {
    weekly
    missingok
    rotate 12
    compress
    delaycompress
    notifempty
    create 0640 node node
}
