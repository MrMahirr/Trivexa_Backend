name: Trivexa Backend CI

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Build project
      run: npm run build

    - name: Start PostgreSQL and Redis containers for E2E Tests
      run: |
        docker run --name pg-test -e POSTGRES_USER=testuser -e POSTGRES_PASSWORD=testpass -e POSTGRES_DB=trivexa_test -p 2678:5432 -d postgres:latest
        docker run --name redis-test -p 6379:6379 -d redis:latest
        # Add sleep to ensure DB is ready
        sleep 5

    - name: Run E2E Tests
      run: |
        # Override environment variables for the test
        export DATABASE_URL=postgres://testuser:testpass@localhost:2678/trivexa_test
        export REDIS_HOST=localhost
        export REDIS_PORT=6379
        npm run test:e2e
      
    - name: Stop and remove containers
      if: always()
      run: |
        docker stop pg-test redis-test || true
        docker rm pg-test redis-test || true
