# Redis Configuration for Trivexa Production
# This configuration enables persistence and optimizes for production use

################################## NETWORK #####################################

# Accept connections from any IP (Docker networking)
bind 0.0.0.0

# Protected mode - yes for production (requires password)
protected-mode yes

# Port
port 6379

# TCP listen() backlog
tcp-backlog 511

# Close connection after client idle for N seconds (0 to disable)
timeout 300

################################## GENERAL #####################################

# Daemonize
daemonize no

# Process ID file
pidfile /var/run/redis_6379.pid

# Log level: debug, verbose, notice, warning
loglevel notice

# Log file
logfile ""

# Number of databases
databases 16

################################## SNAPSHOTTING ################################

# Save the DB to disk (RDB snapshots)
# Format: save <seconds> <changes>

# Save after 15 minutes if at least 1 key changed
save 900 1

# Save after 5 minutes if at least 10 keys changed
save 300 10

# Save after 1 minute if at least 10000 keys changed
save 60 10000

# Stop writes if RDB snapshot fails
stop-writes-on-bgsave-error yes

# Compress RDB files
rdbcompression yes

# Checksum RDB files
rdbchecksum yes

# RDB filename
dbfilename dump.rdb

# Working directory for RDB and AOF files
dir /data

################################## REPLICATION #################################

# Master-Replica replication (if needed)
# replicaof <masterip> <masterport>

################################## SECURITY ####################################

# Require password authentication
# IMPORTANT: Set this via environment variable or uncomment and set
# requirepass YOUR_STRONG_PASSWORD_HERE

# Rename dangerous commands (optional)
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command CONFIG ""

################################### CLIENTS ####################################

# Max number of connected clients
maxclients 10000

############################## MEMORY MANAGEMENT ###############################

# Max memory limit (e.g., 256mb, 1gb)
# IMPORTANT: Set appropriate value for your system
maxmemory 256mb

# Eviction policy when max memory is reached
# Options: noeviction, allkeys-lru, volatile-lru, allkeys-random, volatile-random, volatile-ttl
maxmemory-policy allkeys-lru

############################# LAZY FREEING ####################################

# Lazy freeing to avoid blocking on DEL, UNLINK, etc.
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no

############################## APPEND ONLY MODE ###############################

# Enable AOF persistence (more durable than RDB)
appendonly yes

# AOF filename
appendfilename "appendonly.aof"

# Fsync policy: always, everysec, no
# everysec = good balance between performance and durability
appendfsync everysec

# Don't fsync during BGSAVE or BGREWRITEAOF
no-appendfsync-on-rewrite no

# Auto AOF rewrite
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Load truncated AOF
aof-load-truncated yes

# Use RDB-AOF hybrid format (faster restarts)
aof-use-rdb-preamble yes

################################ SLOW LOG ######################################

# Slow log for queries exceeding execution time (microseconds)
slowlog-log-slower-than 10000

# Max slow log entries
slowlog-max-len 128

################################ LATENCY MONITOR ###############################

# Latency monitoring
latency-monitor-threshold 100

########################### ACTIVE DEFRAGMENTATION #############################

# Enable active defragmentation
# activedefrag yes

################################## INCLUDES ###################################

# Include additional config files if needed
# include /path/to/other.conf
